<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #ar-scene { width: 100%; height: 100%; }

    .button-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 20px;
    }

    .ar-button {
      width: 60px;
      height: 60px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: none;
      background-color: transparent;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .ar-button:active { transform: scale(0.9); filter: brightness(1.2); }
    .ar-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }

    .back-button { position: absolute; top: 20px; left: 20px; z-index: 10; }
  </style>
</head>
<body>

  <!-- pages/domesticanimals/horse.html -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ../../mind/domesticanimals/horse.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="model" src="../../models/domesticanimals/horse.glb"></a-asset-item>
      <audio id="sound" src="../../audio/domesticanimals/horse.mp3" preload="auto"></audio>

      <!-- NEW German pronunciation audio -->
      <audio id="soundGerman" src="../../audio/domesticanimals/horse_german.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
      <a-gltf-model id="animated-model"
        src="#model"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <div class="back-button">
    <a href="../domesticanimals.html">
      <button class="ar-button" style="background-image: url('../../button/back.png');"></button>
    </a>
  </div>

  <div class="button-container" style="display: none;">
    <button id="animateBtn" class="ar-button" style="background-image: url('../../button/animate.png');"></button>
    <button id="audioBtn" class="ar-button" style="background-image: url('../../button/audio.png');"></button>

    <!-- NEW German spelling button -->
    <button id="germanBtn" class="ar-button" style="background-image: url('../../button/german.png');"></button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const target = document.querySelector('#target-entity');
      const model = document.querySelector('#animated-model');

      const sound = document.querySelector('#sound');             
      const soundGerman = document.querySelector('#soundGerman');

      const animateBtn = document.querySelector('#animateBtn');
      const audioBtn = document.querySelector('#audioBtn');
      const germanBtn = document.querySelector('#germanBtn');

      const buttonContainer = document.querySelector('.button-container');

      // show/hide UI
      target.addEventListener('targetFound', () => { buttonContainer.style.display = 'flex'; });
      target.addEventListener('targetLost', () => { buttonContainer.style.display = 'none'; });

      // Animation safety lock
      let isAnimating = false;

      animateBtn.addEventListener('click', () => {
        if (isAnimating) return;

        isAnimating = true;
        animateBtn.disabled = true;

        model.removeAttribute('animation');
        model.setAttribute('animation', {
          property: 'rotation',
          from: '0 0 0',
          to: '0 0 360',
          dur: 4000,
          easing: 'linear',
          loop: 'false'
        });

        // Reset after animation
        setTimeout(() => {
          model.removeAttribute('animation');
          model.setAttribute('rotation', '0 0 0');

          isAnimating = false;
          animateBtn.disabled = false;
        }, 4200);
      });

      // main audio
      audioBtn.addEventListener('click', () => {
        sound.currentTime = 0;
        sound.play();
      });

      // NEW: German audio
      germanBtn.addEventListener('click', () => {
        soundGerman.currentTime = 0;
        soundGerman.play();
      });

    });
  </script>

</body>
</html>
