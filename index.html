<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Board</title>

<style>
body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* Background */
body {
  background: url('mainbg.png') no-repeat center center;
  background-size: contain;
  background-color: black
}

/* Layout */
.container {
  height: 90%;
  display: flex;
  flex-direction: column;
  align-items: center;

  /* push content down like your design */
  padding-top: 30vh;

  gap: 4vh;
}

/* Buttons */
.board-btn {
  width: 90vw;         /* smaller + responsive */
  max-width: 180px;   /* prevent too large */
  cursor: pointer;
  transition: transform 0.2s ease;
}

.board-btn:active {
  transform: scale(0.95);
}

/* Optional: fine-tune spacing on small screens */
@media (max-height: 700px) {
  .container {
    padding-top: 20vh;
    gap: 3vh;
  }
}
</style>
</head>

<body>

<div class="container">

  <img src="oldboard.png" class="board-btn" onclick="goOld()">
  <img src="newboard.png" class="board-btn" onclick="goNew()">

</div>

<script>
function goOld() {
  window.location.href = "old/index.html";
}

function goNew() {
  window.location.href = "new/index.html";
}
</script>

</body>
</html>
